[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rac"
version = "0.1.0"
description = "Repository-aware code completion under a context budget (ENPM703 Group 2)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch",  # unpinned: Colab and CUDA laptops bring their own build
    "transformers>=4.40",
    "accelerate",
    "datasets",
    "rapidfuzz",
    "rank_bm25",
    "numpy",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
gpu = ["bitsandbytes"]
sig = ["tree-sitter", "tree-sitter-python"]
selector = ["scikit-learn"]
dev = ["pytest", "ruff"]

[project.scripts]
rac = "rac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
